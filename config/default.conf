# Default Configuration for Bash Orchestrator

# SSH Defaults
ssh_host = "localhost"
ssh_port = 22
ssh_user = "user"
ssh_key_path = "/path/to/private/key"

# Logging Levels
logging_level = "INFO" # Options: DEBUG, INFO, WARNING, ERROR, CRITICAL
log_file_path = "/var/log/bash_orchestrator.log"

# Retry Settings
max_retries = 5
retry_interval = 10 # in seconds

# Timeout Configurations
command_timeout = 300 # in seconds
ssh_timeout = 30 # in seconds
